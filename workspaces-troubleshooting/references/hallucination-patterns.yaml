# =============================================================================
# WorkSpaces "Looks Real but Wrong" Hallucination Patterns
# =============================================================================

patterns:

  - id: P1-unhealthy-means-broken
    trigger_words: ["UNHEALTHY", "workspace state", "health check"]
    hallucination_risk: CRITICAL
    why_llms_get_this_wrong: >
      LLMs interpret UNHEALTHY as a permanent failure state. WorkSpaces
      health checks run every 20 minutes and a single UNHEALTHY result
      may be transient.
    actual_behavior: >
      UNHEALTHY means the WorkSpace failed the most recent health check.
      It may recover on the next cycle. Common transient causes include
      Windows Update reboots, high CPU during startup, or temporary
      network blips.
    common_false_claim: "The WorkSpace is broken and needs to be rebuilt."
    correct_action: "Wait for the next health check cycle (20 min). Check CloudWatch Available metric. Only escalate after consecutive failures."

  - id: P2-pcoip-web-access
    trigger_words: ["web access", "browser WorkSpaces", "PCoIP web"]
    hallucination_risk: CRITICAL
    why_llms_get_this_wrong: >
      LLMs suggest Web Access for all WorkSpaces regardless of protocol.
      Only WSP supports browser-based access.
    actual_behavior: >
      WorkSpaces Web Access requires the WSP (WorkSpaces Streaming
      Protocol). PCoIP-configured WorkSpaces cannot use Web Access.
      Migration from PCoIP to WSP requires modifying the WorkSpace
      protocol setting, which triggers a reboot.
    common_false_claim: "Access your PCoIP WorkSpace through the web browser."
    correct_action: "Verify protocol with describe-workspaces. Migrate to WSP if Web Access is required."

  - id: P3-rebuild-preserves-all-data
    trigger_words: ["rebuild workspace", "restore workspace", "workspace recovery"]
    hallucination_risk: HIGH
    why_llms_get_this_wrong: >
      LLMs claim rebuild preserves all user data. It only restores from
      the last automatic snapshot, which may be up to 12 hours old.
    actual_behavior: >
      Rebuild restores the root volume (C:) from the original bundle
      image and the user volume (D:) from the most recent automatic
      snapshot. Automatic snapshots occur every 12 hours. Any data
      saved after the last snapshot is permanently lost.
    common_false_claim: "Rebuilding the WorkSpace will restore all your files."
    correct_action: "Warn user about potential data loss. Check last snapshot time with describe-workspace-snapshots before rebuilding."

  - id: P4-single-subnet-ok
    trigger_words: ["workspace subnet", "directory subnet", "single AZ"]
    hallucination_risk: HIGH
    why_llms_get_this_wrong: >
      LLMs suggest registering a directory with a single subnet.
      WorkSpaces requires two subnets in different AZs.
    actual_behavior: >
      Directory registration for WorkSpaces requires exactly two subnets
      in different Availability Zones. This is enforced at registration
      time. Even if all WorkSpaces will be launched in one AZ, both
      subnets must exist with available IP addresses.
    common_false_claim: "Register the directory with your preferred subnet."
    correct_action: "Provide two subnet IDs in different AZs when registering the directory."

  - id: P5-ip-group-empty-allows-all
    trigger_words: ["IP access control", "client IP restriction", "access group"]
    hallucination_risk: HIGH
    why_llms_get_this_wrong: >
      LLMs assume an empty IP access control group means no restrictions.
      An empty group blocks all connections.
    actual_behavior: >
      IP access control groups are allowlists. When associated with a
      directory, only IPs matching rules in the group can connect. An
      empty group (no rules) means no IPs are allowed, blocking all
      connections. No group associated means no IP restrictions.
    common_false_claim: "An empty IP access control group allows all connections."
    correct_action: "Check if IP access control groups are associated. Remove the association to allow all IPs, or add specific CIDR rules."

  - id: P6-ad-connector-partial-ports
    trigger_words: ["AD Connector", "directory connector", "on-premises AD"]
    hallucination_risk: MEDIUM
    why_llms_get_this_wrong: >
      LLMs list only some required ports for AD Connector. All four
      port groups must be open for reliable operation.
    actual_behavior: >
      AD Connector requires ports 53 (DNS/TCP+UDP), 88 (Kerberos/TCP+UDP),
      389 (LDAP/TCP+UDP), and 445 (SMB/TCP) to on-premises domain
      controllers. Missing any single port causes intermittent failures
      that are hard to diagnose.
    common_false_claim: "Open port 389 for LDAP connectivity to your domain controllers."
    correct_action: "Verify all four port groups (53, 88, 389, 445) are open bidirectionally between AD Connector subnets and domain controllers."

  - id: P7-auto-stop-connection-failure
    trigger_words: ["auto-stop", "workspace not responding", "connection timeout"]
    hallucination_risk: MEDIUM
    why_llms_get_this_wrong: >
      LLMs diagnose auto-stop startup delay as a connection failure.
      Starting a stopped WorkSpace takes 1-3 minutes.
    actual_behavior: >
      Auto-stop WorkSpaces stop after the configured idle timeout
      (default 60 minutes). When a user reconnects, the WorkSpace
      must boot up, which takes 1-3 minutes. This is normal behavior
      and not a connectivity issue.
    common_false_claim: "The WorkSpace is failing to connect. Check network settings."
    correct_action: "Check running mode with describe-workspaces. If AutoStop, the startup delay is expected. Inform user to wait 1-3 minutes."

  - id: P8-maintenance-window-outage
    trigger_words: ["workspace unavailable", "ADMIN_MAINTENANCE", "maintenance window"]
    hallucination_risk: MEDIUM
    why_llms_get_this_wrong: >
      LLMs diagnose maintenance-window unavailability as an outage or
      service issue. ADMIN_MAINTENANCE is an expected operational state.
    actual_behavior: >
      AlwaysOn WorkSpaces have a maintenance window (default Sunday
      00:00-04:00 UTC) during which they may reboot for Windows updates.
      WorkSpaces in ADMIN_MAINTENANCE state are temporarily inaccessible.
      This is expected and resolves automatically.
    common_false_claim: "The WorkSpace is experiencing an outage. Contact AWS Support."
    correct_action: "Check if the current time falls within the maintenance window. Verify state with describe-workspaces. Wait for maintenance to complete."

remediation_hallucinations:
  - id: R1-overly-broad-fix
    trigger: "access denied or permission error"
    dangerous_suggestion: "Grant overly broad permissions (Action: *, Resource: *) to resolve the error"
    correct_approach: "Identify the specific denied action from error details or CloudTrail and grant only that action on the specific resource"

  - id: R2-disable-security-control
    trigger: "blocked by security control or policy"
    dangerous_suggestion: "Disable the security control to unblock the operation"
    correct_approach: "Add a specific exception for the legitimate use case while keeping the control active"
